<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALFRED — YouTube Routine Player</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#05070b; color:#dbfcff; }
    body { margin:0; min-height:100vh; display:block; background:radial-gradient(circle at 20% 10%, rgba(0,240,255,.18), transparent 28%), radial-gradient(circle at 80% 20%, rgba(138,43,226,.2), transparent 35%), #05070b; overflow:hidden; }
    main { width:100%; height:100vh; box-sizing:border-box; display:flex; flex-direction:column; gap:10px; }
    .panel { border:0; border-radius:0; background:rgba(10,10,11,.72); box-shadow:0 30px 100px rgba(0,0,0,.45); padding:14px; }
    h1 { margin:0 0 4px; font-family: Georgia, serif; letter-spacing:-.04em; color:white; font-size:clamp(24px,4vw,46px); }
    p { color:rgba(219,252,255,.72); margin:0 0 8px; }
    #player { width:100%; flex:1; min-height:220px; border-radius:12px; overflow:hidden; background:#000; }
    .meta { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:8px; font-family:monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#ffd700; }
    a { color:#00f0ff; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>ALFRED Routine Player</h1>
    <p>Reproductor de rutina diaria con YouTube IFrame API. Alfred ajusta el volumen a nivel moderado cuando el navegador lo permite.</p>
    <div id="player"></div>
    <div class="meta">
      <span id="status">Inicializando...</span>
      <a id="original" target="_blank" rel="noopener noreferrer">Abrir en YouTube</a>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const videoId = params.get('video') || 'rvLNvq5_-Fw';
    const list = params.get('list') || '';
    const index = Number(params.get('index') || '1');
    const volume = Math.max(0, Math.min(100, Number(params.get('volume') || '40')));
    const startMuted = params.get('muted') === '1';
    const original = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}${list ? `&list=${encodeURIComponent(list)}` : ''}${index ? `&index=${index}` : ''}`;
    document.getElementById('original').href = original;
    document.getElementById('status').textContent = `${startMuted ? 'Silenciado por Alfred' : `Volumen objetivo: ${volume}/100`} · Video: ${videoId}`;

    let player;
    function applyAudioState(action, nextVolume) {
      if (!player || typeof player.mute !== 'function') return;
      try {
        if (action === 'mute') {
          player.mute();
          document.getElementById('status').textContent = 'Silenciado por Alfred · micrófono protegido';
        } else if (action === 'unmute') {
          player.unMute();
          player.setVolume(Math.max(0, Math.min(100, Number(nextVolume ?? volume))));
          document.getElementById('status').textContent = `Reproduciendo · volumen ${Math.max(0, Math.min(100, Number(nextVolume ?? volume)))}/100`;
        } else if (action === 'volume') {
          player.setVolume(Math.max(0, Math.min(100, Number(nextVolume ?? volume))));
          document.getElementById('status').textContent = `Volumen ajustado por Alfred · ${Math.max(0, Math.min(100, Number(nextVolume ?? volume)))}/100`;
        } else if (action === 'pause') {
          player.pauseVideo();
          document.getElementById('status').textContent = 'Pausado por Alfred';
        } else if (action === 'play') {
          player.playVideo();
          if (startMuted) player.mute();
          document.getElementById('status').textContent = startMuted ? 'Reproduciendo silenciado por Alfred' : `Reproduciendo · volumen ${volume}/100`;
        }
      } catch (err) {
        document.getElementById('status').textContent = 'No pude controlar el audio automáticamente; use el control del navegador.';
      }
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) return;
      const data = event.data || {};
      if (data.type !== 'alfred-youtube-control') return;
      applyAudioState(data.action, data.volume);
    });
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        videoId,
        playerVars: { autoplay: 1, listType: list ? 'playlist' : undefined, list: list || undefined, index, rel: 0, modestbranding: 1 },
        events: {
          onReady: (event) => {
            try {
              event.target.setVolume(volume);
              if (startMuted) event.target.mute();
              else event.target.unMute();
              event.target.playVideo();
              document.getElementById('status').textContent = startMuted ? 'Reproduciendo silenciado por Alfred · micrófono protegido' : `Reproduciendo · volumen moderado ${volume}/100`;
            } catch (err) {
              document.getElementById('status').textContent = 'No pude ajustar volumen automáticamente; use el control del navegador.';
            }
          },
          onError: () => {
            document.getElementById('status').textContent = 'YouTube no permitió reproducir este video embebido; abra el enlace original.';
          }
        }
      });
    };
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
